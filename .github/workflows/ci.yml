name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The minified site in dist/, exactly what is deployed.
      - run: pnpm build

      # Total transfer under 2 MB and an estimated load under 2 s (PRD 2, 9).
      - run: pnpm size

  release:
    name: Release
    needs: check
    # Every push to main: semantic-release reads the Conventional Commits since
    # the last tag, picks the next version, sets it in package.json (which the
    # Settings screen shows), commits that back to main, tags it and publishes
    # GitHub release notes. Commits that aren't feat/fix/breaking make no release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pages:
    name: Build the GitHub Pages site
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main, not the pushed commit, so the version semantic-release just set is built in.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v6

      # A new service worker VERSION per deploy gives players a fresh offline cache.
      - name: Build the minified site
        run: pnpm build
        env:
          SW_VERSION: ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # The upload and the deploy live in separate jobs, as GitHub's Pages starter
    # workflow does. A freshly uploaded artifact can take seconds to appear in the
    # run's artifact listing, so deploy-pages run straight after the upload fails
    # with 'No artifacts named "github-pages"' (actions/deploy-pages#451). Separate
    # jobs also mean a failed deploy can be re-run alone, without uploading a second
    # "github-pages" artifact (which fails with 'Multiple artifacts').
    needs: build-pages
    # Needs the repo's Pages source set to "GitHub Actions" (Settings > Pages), and
    # the repo public or on a paid plan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-final.outputs.page_url }}
    steps:
      # deploy-pages fails before creating a deployment when the artifact isn't
      # listed yet, so it is safe to try again after waiting for the listing.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deployment-retry.outcome == 'failure'
        run: sleep 60

      - id: deployment-final
        if: steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
